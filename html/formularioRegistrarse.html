<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../css/principal.css">
    <title>Formulario</title>
</head>
<body class="body-formulario">
    <nav class="navigation">
            <div class="logoTitle">
                <a href="CulitoDeRana.html"><img src="../imagenes/rana.png" alt="logo" class="logo"></img></a>
                <p class="title">Culitos de rana</p>
            </div>
    </nav>

    <div class="envoltorio-formulario">
        <div class="formulario">
            <h2>Registra tu culito</h2>
            <form action="../php/insertUsuario.php" method="post" enctype="multipart/form-data">

                 <div class="input-name">
                    <label for="nombre"><em>Nombre:</em></label>
                    <input class="input" type="text" id="nombre" name="nombre" placeholder="Introduce tu nombre">
                </div>

                <div class="input-contrasenia">
                    <label for="contrasenia"><em>Contraseña:</em></label>
                    <input type="text" class="input" id="contrasenia" name="contrasenia" placeholder="Introduce tu contraseña">
                </div>

                <div class="input-acceso">
                    <label for="acceso"><em>acceso</em></label>
                    <input type="number" class="input" id="acceso" name="acceso">
                </div>

                <br>

                <div class="input-submit">
                    <input class="input" type="submit" id="btnEnviar" value="Enviar">
                </div>

            </form>
        </div>

    </div>
</body>
<script src="../js/formulario.js"></script>
</html>
